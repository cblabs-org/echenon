<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#121212"><link rel="manifest" href="/manifest.json"><title>Echenon Ride</title><style>
:root{--bg-page:#121212;--card-bg:#1e1e1e;--border:#333333;--border-subtle:#444444;--text:#ffffff;--text-muted:rgba(255,255,255,.7);--text-subtle:rgba(255,255,255,.5);--text-soft:rgba(255,255,255,.8);--primary:#2196F3;--success:#4CAF50;--success-bg:#2e7d32;--warning:#FF9800;--danger:#f44336;--danger-bg:#c62828;--badge-idle-bg:#555555;--text-inverse:#ffffff;--text-on-warning:#000000;--scrim:rgba(0,0,0,.8);--shadow-modal:rgba(0,0,0,.9)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-page);color:var(--text);max-width:480px;margin:0 auto;padding:8px;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
header h1{font-size:18px;font-weight:600}
header a{color:var(--text-muted);text-decoration:none;font-size:22px;display:flex;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}
.b-idle{background:var(--badge-idle-bg);color:var(--text-inverse)}
.b-active{background:var(--success-bg);color:var(--text-inverse);animation:pulse 1.5s infinite}
.b-paused{background:var(--warning);color:var(--text-on-warning)}
@keyframes pulse{50%{opacity:.7}}
.card{background:var(--card-bg);border-radius:12px;border:1px solid var(--border);padding:10px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.metric{text-align:center}
.metric .v{font-size:28px;font-weight:700;line-height:1.1}
.metric .l{font-size:10px;color:var(--text-muted);text-transform:uppercase}
.btns{display:flex;gap:6px;margin:6px 0}
.btns button{flex:1;min-height:48px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text-inverse)}
.btn-start{background:var(--success-bg)}
.btn-pause{background:var(--warning);color:var(--text-on-warning)}
.btn-stop{background:var(--danger-bg)}
button:disabled{opacity:.35;cursor:default}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;margin:4px 0}
.switch{position:relative;display:inline-block;width:38px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:22px;transition:.2s}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:var(--text-inverse);border-radius:50%;transition:.2s}
input:checked+.slider{background:var(--success)}
input:checked+.slider:before{transform:translateX(16px)}
.stats{display:flex;justify-content:space-around;font-size:13px;color:var(--text-muted)}
.stats span{text-align:center}
.stats b{display:block;color:var(--text);font-size:16px}
#upload{font-size:12px;color:var(--text-muted)}
#history .r{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;gap:2px}
#history .r:last-child{border:none}
#history a{color:var(--primary);text-decoration:none;font-size:12px}
#empty{color:var(--text-subtle);text-align:center;padding:12px;font-size:13px}
.conn{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.conn.on{background:var(--success)}
.conn.off{background:var(--danger)}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
.modal-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:340px;width:100%;box-shadow:0 8px 32px var(--shadow-modal);text-align:center}
.modal-btns{display:flex;flex-direction:column;gap:8px}
.m-btn{width:100%;min-height:50px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text-inverse);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;gap:2px}
.m-btn small{font-size:11px;font-weight:400;opacity:.75}
.m-btn.btn-save{background:var(--success-bg)}
.m-btn.btn-discard{background:var(--danger-bg)}
.m-btn.btn-cancel{background:var(--border);border:1px solid var(--border-subtle)}
</style></head><body>
<header><h1>Echenon</h1><div><span class="conn off" id="ws-dot" aria-hidden="true"></span><span class="badge b-idle" id="badge">IDLE</span></div><a href="/" title="Settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a></header>
<div id="runaway-banner" role="alert" style="display:none;background:var(--danger-bg);color:var(--text-inverse);font-weight:700;padding:8px 12px;border-radius:8px;margin:6px 0;text-align:center;animation:pulse 1s infinite">⚠️ RUNAWAY DETECTED — STOP PEDALLING</div>
<div class="card"><div class="grid" id="m">
<div class="metric"><div class="v" id="cad">--</div><div class="l">RPM</div></div>
<div class="metric"><div class="v" id="pwr">--</div><div class="l">Watts</div></div>
<div class="metric"><div class="v" id="spd">--</div><div class="l">km/h</div></div>
<div class="metric"><div class="v" id="hr">--</div><div class="l">BPM</div></div>
<div class="metric"><div class="v" id="lvl">--</div><div class="l">Level</div></div>
<div class="metric"><div class="v" id="tmr">0:00</div><div class="l">Time</div></div>
</div></div>
<div class="btns"><button class="btn-start" id="b-start" onclick="R.cmd('start')">Start</button><button class="btn-pause" id="b-pause" onclick="R.cmd('pause')" disabled>Pause</button><button class="btn-stop" id="b-stop" onclick="R.cmd('stop')" disabled>Stop</button></div>
<div class="toggle-row"><span style="font-size:13px;color:var(--text-soft)">Auto-start</span><label class="switch"><input type="checkbox" id="auto-start" aria-label="Auto-start" checked><span class="slider"></span></label></div>
<div class="card"><div class="stats" id="st"><span>Avg Power<b id="ap">-- W</b></span><span>Distance<b id="dst">-- km</b></span></div><div id="upload"></div></div>
<div class="card"><b style="font-size:13px">Recent Rides</b><div id="history"><div id="empty">No rides yet — start your first session!</div></div></div>
<div id="stop-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
<div class="modal-card">
<h2 id="modal-title" style="font-size:17px;font-weight:700;margin-bottom:6px">End Ride</h2>
<p style="font-size:13px;color:var(--text-muted);margin-bottom:14px">Choose an option for this ride session:</p>
<div class="modal-btns">
<button class="m-btn btn-save" onclick="R.stopAction('save')"><span>Save &amp; Finish</span><small>Save to device and push to Strava</small></button>
<button class="m-btn btn-discard" onclick="R.stopAction('discard')"><span>Discard Ride</span><small>Delete session without saving</small></button>
<button class="m-btn btn-cancel" onclick="R.stopAction('cancel')"><span>Cancel</span><small>Continue with ride</small></button>
</div>
</div>
</div>
<script src="/ride.js"></script></body></html>
